[package]
name = "peacockery-meetily"
version = "0.5.0"
description = "Peacockery Meetily: internal Windows call and meeting recorder on the Peacockery Voice API"
authors = ["Peacockery Studio"]
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = "0.7"
log = "0.4"
chrono = { version = "0.4.31", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
dirs = "5.0.1"
regex = "1.11.0"
url = "2.5"

# Audio capture and processing
cpal = "0.15.3"
rubato = "0.15.0"
ebur128 = "0.1"
bytemuck = "1.16.1"
# Import validation: container probing for the duration (no decoding)
symphonia = { version = "0.5.4", default-features = false, features = ["aac", "isomp4", "mp3", "flac", "ogg", "vorbis", "pcm", "wav", "mkv"] }

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros"] }

tauri = { version = "2.6.2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2.3.0"
tauri-plugin-log = "2.6.0"
tauri-plugin-single-instance = "2.3.7"
tauri-plugin-store = "2.4.0"

# Peacockery Voice API client and Chrome process-tree loopback (workspace crates)
peacockery-voice = { path = "../../crates/peacockery-voice" }
app-loopback = { path = "../../crates/app-loopback" }

[target.'cfg(windows)'.dependencies]
# API key in Windows Credential Manager (ARCHITECTURE.md §2)
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(not(windows))'.dependencies]
# Linux is dev-only: kernel keyutils (no Secret Service daemon needed)
keyring = { version = "3.6.3", features = ["linux-native"] }

[dev-dependencies]
tempfile = "3.3.0"
hound = "3.5"
