[workspace]
resolver = "2"
members = [
    "frontend/src-tauri",
    "crates/peacockery-voice",
    "crates/app-loopback",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }
