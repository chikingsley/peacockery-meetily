[package]
name = "peacockery-voice"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Async client for the Peacockery Voice API: batch and realtime transcription, live lines, turns, speaker naming, text"

[dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
tokio = { version = "1.45", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-util = "0.7"
tracing = "0.1"
url = "2.5"

[dev-dependencies]
hound = "3.5"
tokio = { version = "1.45", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
